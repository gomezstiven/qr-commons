name: Feature request
description: Propose a capability or improvement
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architectural considerations
      description: Note implications for portability, local-first behavior, scannability, or generation-vs-resolution boundaries.
