name: Bug report
description: Report incorrect or unexpected QR Commons behavior
title: "bug: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest useful reproduction, including payload type and relevant settings.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, package version, or commit if relevant.
